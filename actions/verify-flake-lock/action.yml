name: verify flake.lock
description: Fails when a locked github input is not on the branch or tag it follows or newer than min-age

inputs:
  lockfile:
    description: path to the lock file
    default: flake.lock
  min-age:
    description: minimum age of every locked commit, as a nushell duration (e.g. 7day). 0sec = none
    default: 0sec
  token:
    description: token for the GitHub API with read access to public repos
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: ByteZ1337/setup-mise@v1.0.0
      with:
        version: v2026.11.14
        sha256: fdf945a962cd4a3217f8f6bc8d6bbbbd1c600d0b252cbd05f87652887e020baa

    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LOCKFILE: ${{ inputs.lockfile }}
        MIN_AGE: ${{ inputs.min-age }}
      run: |
        set -euo pipefail
        MISE_SAFE=1 mise -C "$GITHUB_ACTION_PATH" install --locked
        nu_bin="$(MISE_SAFE=1 mise -C "$GITHUB_ACTION_PATH" which nu)"
        "$nu_bin" "$GITHUB_ACTION_PATH/verify.nu" "$LOCKFILE" --min-age "$MIN_AGE"
