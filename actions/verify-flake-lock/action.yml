name: verify flake.lock
description: Fails when a locked github input is not on the branch or tag it follows or newer than min-age

inputs:
  lockfile:
    description: path to the lock file
    default: flake.lock
  min-age:
    description: minimum age of every locked commit, as a nushell duration (e.g. 7day). 0sec = none
    default: 0sec
  token:
    description: token for the GitHub API with read access to public repos
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: ByteZ1337/setup-nu@v1
      with:
        version: 0.117.0
        sha256: 33b907da92b0e80bd10fea9fa0e8a1624cabfebd89ee2568e365da3c492ffc68

    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LOCKFILE: ${{ inputs.lockfile }}
        MIN_AGE: ${{ inputs.min-age }}
      run: nu "$GITHUB_ACTION_PATH/verify.nu" "$LOCKFILE" --min-age "$MIN_AGE"
